steps:
# Build the optimized Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build', 
    '-f', 'Dockerfile', 
    '--target', 'production',
    '-t', 'northamerica-northeast2-docker.pkg.dev/university-bot-467017/ai-advisor/university_advising_backend:latest', 
    '.'
  ]

# Push the image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'northamerica-northeast2-docker.pkg.dev/university-bot-467017/ai-advisor/university_advising_backend:latest']

# Deploy to Cloud Run with optimized settings
- name: 'gcr.io/cloud-builders/gcloud'
  args: 
  - 'run'
  - 'deploy'
  - 'university-advising-chatbot'
  - '--image'
  - 'northamerica-northeast2-docker.pkg.dev/university-bot-467017/ai-advisor/university_advising_backend:latest'
  - '--region'
  - 'northamerica-northeast2'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
  - '--port'
  - '8080'
  - '--memory'
  - '4Gi'
  - '--cpu'
  - '2'
  - '--min-instances'
  - '1'
  - '--max-instances'
  - '10'
  - '--concurrency'
  - '80'
  - '--timeout'
  - '300'
  - '--set-env-vars'
  - 'PYTHONPATH=/app/backend,PYTHONDONTWRITEBYTECODE=1'

# Set timeout for builds
timeout: '1800s'

# Use high-performance machine for faster builds
options:
  machineType: 'E2_HIGHCPU_8'