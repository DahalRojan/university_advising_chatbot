steps:
# Build the Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'northamerica-northeast2-docker.pkg.dev/university-bot-467017/ai-advisor/university_advising_backend:latest', '.']

# Push the image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'northamerica-northeast2-docker.pkg.dev/university-bot-467017/ai-advisor/university_advising_backend:latest']

# Deploy to Cloud Run
- name: 'gcr.io/cloud-builders/gcloud'
  args: 
  - 'run'
  - 'deploy'
  - 'university-advising-chatbot'
  - '--image'
  - 'northamerica-northeast2-docker.pkg.dev/university-bot-467017/ai-advisor/university_advising_backend:latest'
  - '--region'
  - 'northamerica-northeast2'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
  - '--port'
  - '8080'
  - '--memory'
  - '2Gi'
  - '--cpu'
  - '2'
  - '--set-env-vars'
  - 'PORT=8080,PYTHONPATH=/app/backend'

# Set timeout for long builds
timeout: '1200s'

# Use high-performance machine for faster builds
options:
  machineType: 'E2_HIGHCPU_8'